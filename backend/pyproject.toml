[project]
name = "studyos-backend"
version = "0.1.0"
description = "StudyOS — Personal Learning OS Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "chromadb>=0.5.0",
    "openai>=1.30.1",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.8",
    "pymupdf>=1.24.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
